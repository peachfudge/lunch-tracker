name: Update Holidays

on:
  schedule:
    - cron: '0 0 1 * *'  # 매월 1일 자동 실행
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and save holidays
        env:
          API_KEY: ${{ secrets.HOLIDAY_API_KEY }}
        run: python3 fetch_holidays.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add holidays.json
          git diff --staged --quiet || git commit -m "Update holidays $(date +%Y-%m-%d)"
          git push
